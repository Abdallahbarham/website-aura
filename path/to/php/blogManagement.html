<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Management</title>
    <link rel="stylesheet" href="path/to/toast.css"> <!-- Include your toast notification CSS -->
</head>
<body>
    <!-- ...existing code... -->
    <button id="createPostButton">Create Post</button>
    <button id="testButton">Test</button>
    <!-- ...existing code... -->

    <script src="path/to/toast.js"></script> <!-- Include your toast notification JS -->
    <script>
        document.getElementById('testButton').addEventListener('click', function() {
            const testData = {
                title: 'Test Post',
                excerpt: 'This is a test excerpt.',
                category: 'Test Category',
                tags: 'test,post',
                readTime: '1 min',
                imageUrl: 'http://example.com/test.jpg',
                content: 'This is the content of the test post.'
            };

            // Log the test data for debugging
            console.log("Test Data: ", testData);

            fetch('path/to/php/testInsert.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(testData)
            })
            .then(response => {
                console.log("Fetch Response: ", response);
                return response.json();
            })
            .then(data => {
                console.log("Response Data: ", data);
                if (data.message === 'Post created successfully') {
                    showToast('Success', 'Test post created successfully');
                } else {
                    showToast('Error', 'Failed to create test post: ' + data.error);
                }
            })
            .catch(error => {
                console.error("Fetch Error: ", error);
                showToast('Error', 'Failed to create test post: ' + error.message);
            });
        });

        function showToast(title, message) {
            // Implement your toast notification logic here
            // Example:
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<strong>${title}</strong><p>${message}</p>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
